name: maple-sunday-bot

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maple_sunday_bot}
      MYSQL_USER: ${MYSQL_USER:-maple_bot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maple_sunday_bot}
      MYSQL_USER: ${MYSQL_USER:-maple_bot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      MYSQL_TLS_MODE: ${MYSQL_TLS_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
